version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula
      POSTGRES_DB: nebula
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=host=db user=nebula password=nebula dbname=nebula port=5432 sslmode=disable
      - PORT=8080
    ports:
      - "8080:8080"

volumes:
  db-data:
